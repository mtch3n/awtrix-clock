display_information:
  name: AWTRIX
  description: Shows unread Slack DMs and mentions on AWTRIX
  background_color: "#2b2622"
oauth_config:
  scopes:
    user:
      - im:read
      - mpim:read
      - im:history
      - mpim:history
      - users:read
      - search:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
